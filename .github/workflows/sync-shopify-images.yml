name: Sync Shopify image galleries

# Manual only. Adds missing Lovecherry gallery images (gallery_1..8) to existing
# Shopify products. Touches nothing else. Dry run unless "apply" is true.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to Shopify (false = dry run, report only)"
        type: boolean
        default: false
      limit:
        description: "Max matched products to process (0 = all)"
        default: "0"
      round:
        description: "Internal: continuation counter (max 12 chained runs)"
        default: "1"

  # Push of this file = authentication test + small DRY RUN (never writes).
  push:
    branches: [fix/feeds]
    paths: ["sync-trigger.txt"]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-shopify-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check which secrets exist (names only, never values)
        env:
          A: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          B: ${{ secrets.SHOPIFY_CLIENT_ID }}
          C: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          miss=0
          for n in A:SHOPIFY_STORE_DOMAIN B:SHOPIFY_CLIENT_ID C:SHOPIFY_CLIENT_SECRET; do
            v="${n%%:*}"; name="${n#*:}"
            if [ -n "${!v}" ]; then echo "$name: set"; else echo "::error::$name: MISSING"; miss=1; fi
          done
          exit $miss
      - name: Authentication test
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_shopify_images.py --auth-test
      - name: Sync images
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          args="--limit ${{ inputs.limit || 200 }}"
          if [ "${{ inputs.apply }}" = "true" ]; then args="$args --apply"; fi
          # Push trigger: first line of sync-trigger.txt "apply limit=N" = authorised capped apply
          if [ "${{ github.event_name }}" = "push" ] && [ "$(head -1 sync-trigger.txt)" = "apply all" ]; then
            args="--limit 0 --apply"   # full catalog, explicitly authorised by the owner
          elif [ "${{ github.event_name }}" = "push" ] && grep -Eq '^apply limit=[0-9]+$' <(head -1 sync-trigger.txt); then
            n=$(head -1 sync-trigger.txt | sed 's/.*limit=//')
            [ "$n" -ge 1 ] && [ "$n" -le 20 ] || { echo "::error::capped apply allows limit 1-20"; exit 1; }
            args="--limit $n --apply"
          fi
          python sync_shopify_images.py $args --report public/reports/shopify_image_sync_${{ github.run_id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopify-image-sync-report
          path: public/reports/shopify_image_sync_*.json
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reports/ || true
          git diff --cached --quiet && exit 0
          git commit -m "Shopify image sync report"
          for a in 1 2 3; do
            git pull --rebase -X theirs origin "${{ github.ref_name }}" || git rebase --abort
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((a*5))
          done
      - name: Continue automatically if the time budget ran out
        if: always() && (inputs.apply == true || (github.event_name == 'push' && hashFiles('sync-trigger.txt') != '' ))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python3 -c "import json;print(json.load(open('public/reports/shopify_image_sync_${{ github.run_id }}.json')).get('not_processed_time_budget',0))")
          round=${{ inputs.round || 1 }}
          echo "not processed: $left (round $round)"
          if [ "$left" -gt 0 ] && [ "$round" -lt 12 ]; then
            gh workflow run sync-shopify-images.yml --ref "${{ github.ref_name }}" \
              -f apply=true -f limit=0 -f round=$((round+1))
          fi
